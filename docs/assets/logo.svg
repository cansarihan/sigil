<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Sigil">
  <title>Sigil</title>
  <!-- The seal ring, one arc per signer: two of three approvals collected.
       The same mark the dashboard draws on every proposal. -->
  <g transform="rotate(-90 50 50)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#B03A3A" stroke-width="9" stroke-linecap="round" stroke-dasharray="70.776 180.552" stroke-dashoffset="0.000" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="#B03A3A" stroke-width="9" stroke-linecap="round" stroke-dasharray="70.776 180.552" stroke-dashoffset="-83.776" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="#4A4238" stroke-width="9" stroke-linecap="round" stroke-dasharray="70.776 180.552" stroke-dashoffset="-167.552" />
  </g>
  <!-- The seal pressed into the middle. The diamond is the glyph the signer
       roll uses for each member, so the mark and the UI speak the same language. -->
  <circle cx="50" cy="50" r="21" fill="#B03A3A" />
  <path d="M50 37 L63 50 L50 63 L37 50 Z" fill="#EDE6D8" />
</svg>
